<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" style="background:#f8f5e6">
  <title>门派分布图</title>
  <desc>仿剑三门派地图风格，展示8大门派与12小帮派分布</desc>
  <defs>
    <radialGradient id="main-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="100%" stop-color="#f8f5e6"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#bfa76a"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#main-bg)"/>
  <!-- 中心圆，主门派 -->
  <circle cx="800" cy="450" r="220" fill="#fffbe6" stroke="#bfa76a" stroke-width="6"/>
  <!-- 外环圆，小帮派 -->
  <circle cx="800" cy="450" r="350" fill="none" stroke="#e0cfa0" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- 8大门派分布 -->
  <g font-family="STKaiti, KaiTi, serif" font-size="32" font-weight="bold">
    <g fill="#d32f2f" stroke="#7b1f1f" stroke-width="1.5" filter="url(#shadow)">
      <circle cx="800" cy="230" r="38"/>
      <circle cx="1080" cy="310" r="38"/>
      <circle cx="1200" cy="530" r="38"/>
      <circle cx="1080" cy="690" r="38"/>
      <circle cx="800" cy="770" r="38"/>
      <circle cx="520" cy="690" r="38"/>
      <circle cx="400" cy="530" r="38"/>
      <circle cx="520" cy="310" r="38"/>
    </g>
    <g fill="#fff">
      <text x="800" y="240" text-anchor="middle">少林</text>
      <text x="1080" y="320" text-anchor="middle">武当</text>
      <text x="1200" y="540" text-anchor="middle">峨眉</text>
      <text x="1080" y="700" text-anchor="middle">丐帮</text>
      <text x="800" y="780" text-anchor="middle">明教</text>
      <text x="520" y="700" text-anchor="middle">天山</text>
      <text x="400" y="540" text-anchor="middle">昆仑</text>
      <text x="520" y="320" text-anchor="middle">华山</text>
    </g>
  </g>
  <!-- 12小帮派分布 -->
  <g font-family="STKaiti, KaiTi, serif" font-size="22" font-weight="bold">
    <g fill="#1976d2" stroke="#0d3050" stroke-width="1" filter="url(#shadow)">
      <circle cx="800" cy="100" r="22"/>
      <circle cx="1040" cy="170" r="22"/>
      <circle cx="1260" cy="320" r="22"/>
      <circle cx="1350" cy="530" r="22"/>
      <circle cx="1260" cy="740" r="22"/>
      <circle cx="1040" cy="830" r="22"/>
      <circle cx="800" cy="870" r="22"/>
      <circle cx="560" cy="830" r="22"/>
      <circle cx="340" cy="740" r="22"/>
      <circle cx="250" cy="530" r="22"/>
      <circle cx="340" cy="320" r="22"/>
      <circle cx="560" cy="170" r="22"/>
    </g>
    <g fill="#fff">
      <text x="800" y="108" text-anchor="middle">青城</text>
      <text x="1040" y="178" text-anchor="middle">点苍</text>
      <text x="1260" y="328" text-anchor="middle">五毒</text>
      <text x="1350" y="538" text-anchor="middle">唐门</text>
      <text x="1260" y="748" text-anchor="middle">恒山</text>
      <text x="1040" y="838" text-anchor="middle">崆峒</text>
      <text x="800" y="878" text-anchor="middle">嵩山</text>
      <text x="560" y="838" text-anchor="middle">铁掌</text>
      <text x="340" y="748" text-anchor="middle">灵鹫</text>
      <text x="250" y="538" text-anchor="middle">雪山</text>
      <text x="340" y="328" text-anchor="middle">百花</text>
      <text x="560" y="178" text-anchor="middle">血刀</text>
    </g>
  </g>
  <!-- 标题 -->
  <text x="800" y="60" text-anchor="middle" font-size="44" font-family="STKaiti, KaiTi, serif" fill="#bfa76a" font-weight="bold">江湖门派分布图</text>
  <!-- 图例 -->
  <g font-family="STKaiti, KaiTi, serif" font-size="18">
    <rect x="1320" y="60" width="220" height="80" rx="16" fill="#fffbe6" stroke="#bfa76a" stroke-width="2"/>
    <circle cx="1350" cy="90" r="16" fill="#d32f2f" stroke="#7b1f1f" stroke-width="1.5"/>
    <text x="1370" y="96" fill="#7b1f1f">八大门派</text>
    <circle cx="1350" cy="130" r="10" fill="#1976d2" stroke="#0d3050" stroke-width="1"/>
    <text x="1370" y="134" fill="#0d3050">十二小帮派</text>
  </g>
</svg>
